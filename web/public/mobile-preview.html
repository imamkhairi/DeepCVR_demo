<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive 3D cell-volume visualization demo" />
    <title>DeepCVR demo</title>
    <script type="module" crossorigin src="./assets/index-DqNm2WRO.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D6L-G2BQ.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="intro">
        <h1>DeepCVR demo</h1>
        <p>Explore reconstructed cell volumes in 3D.</p>
        <div class="viewer-options">
          <label for="dataset">Volume</label>
          <select id="dataset" aria-label="Choose a reconstruction"></select>
          <label class="toggle" for="auto-rotate">
            <input id="auto-rotate" type="checkbox" checked />
            <span>Auto-rotate</span>
          </label>
        </div>
        <p id="viewer-status" class="viewer-status" role="status" aria-live="polite">Preparing 3D viewers…</p>
      </section>
      <section id="mobile-comparison" class="mobile-comparison" aria-label="Reconstruction viewer" hidden>
        <div class="mobile-tabs" role="tablist" aria-label="Reconstruction method">
          <button type="button" role="tab" data-volume-kind="deepcvr" aria-selected="true">DeepCVR</button>
          <button type="button" role="tab" data-volume-kind="dip" aria-selected="false">DIP</button>
        </div>
        <article class="comparison-panel">
          <h2 id="mobile-view-title">DeepCVR reconstruction result</h2>
          <div id="mobile-window" class="render-window" aria-label="DeepCVR reconstruction result 3D view"></div>
        </article>
      </section>
      <section id="desktop-comparison" class="comparison-stack" aria-label="DeepCVR and DIP reconstruction comparison">
        <article class="comparison-panel">
          <h2>DeepCVR reconstruction result</h2>
          <div id="deepcvr-window" class="render-window" aria-label="DeepCVR 3D reconstruction"></div>
        </article>
        <article class="comparison-panel">
          <h2>DIP reconstruction result</h2>
          <div id="dip-window" class="render-window" aria-label="DIP 3D reconstruction"></div>
        </article>
      </section>
    </main>
  </body>
</html>
